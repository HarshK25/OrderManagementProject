# ─────────────────────────────────────────────
# Default / shared configuration
# ─────────────────────────────────────────────
spring:
  application:
    name: order-management-system

  # ── JPA ──────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate          # Flyway owns the schema; Hibernate only validates
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 20

  # ── Flyway ────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  # ── Redis ─────────────────────────────────────
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

  # ── RabbitMQ ──────────────────────────────────
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: /
    listener:
      simple:
        acknowledge-mode: manual   # Manual ack for all consumers
        prefetch: 1

  # ── Mail (Gmail SMTP) ─────────────────────────
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  # ── Thymeleaf ─────────────────────────────────
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    cache: true

# ── Actuator ──────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  health:
    redis:
      enabled: true
    rabbit:
      enabled: true

# ── Springdoc / Swagger ───────────────────────
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  show-actuator: false

# ── App custom properties ─────────────────────
app:
  jwt:
    secret: ${JWT_SECRET:ThisIsAVeryLongSecretKeyThatShouldBeChangedInProductionAndMustBeAtLeast512BitsLongForHS512Algorithm}
    access-token-expiry-ms: 900000        # 15 minutes
    refresh-token-expiry-days: 7

  payment:
    window-minutes: ${PAYMENT_WINDOW_MINUTES:15}

  razorpay:
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}

  admin:
    seed-email: ${ADMIN_EMAIL:admin@ordermanagement.com}
    seed-password: ${ADMIN_PASSWORD:Admin@12345}
    seed-name: ${ADMIN_NAME:System Admin}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

---
# ─────────────────────────────────────────────
# Dev profile  (active by default locally)
# Run with:  SPRING_PROFILES_ACTIVE=dev
# ─────────────────────────────────────────────
spring:
  config:
    activate:
      on-profile: dev

  # ── Datasource ────────────────────────────────
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:orderdb}
    username: ${DB_USERNAME:orderuser}
    password: ${DB_PASSWORD:orderpass}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 20000

  jpa:
    show-sql: true

  thymeleaf:
    cache: false

logging:
  level:
    com.ordermanagement: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

---
# ─────────────────────────────────────────────
# Prod profile
# Run with:  SPRING_PROFILES_ACTIVE=prod
# ─────────────────────────────────────────────
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    show-sql: false

logging:
  level:
    root: WARN
    com.ordermanagement: INFO
